spring.application.name=backend

# Puerto del backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/invernadero_db
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:adminpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

invernadero.historico.intervalo-ms=60000
invernadero.historico.retencion-dias=90
invernadero.alertas.cooldown-seg=60
invernadero.cors.origenes=http://localhost:5173