spring.application.name=backend

# Puerto del backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/invernadero_db
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:adminpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Si el listener lanza una excepción, no reencolar el mensaje en bucle infinito
spring.rabbitmq.listener.simple.default-requeue-rejected=false

invernadero.historico.intervalo-ms=60000
invernadero.historico.retencion-dias=90
invernadero.alertas.cooldown-seg=60
invernadero.cors.origenes=http://localhost:5173,http://127.0.0.1:5173

# Potencias y caudal NOMINALES para estimar energía y agua. Ajústalos a tu hardware real.
invernadero.consumo.caloventor-kw=2.0
invernadero.consumo.humidificador-kw=0.3
invernadero.consumo.bomba-kw=0.1
invernadero.consumo.bomba-litros-hora=60